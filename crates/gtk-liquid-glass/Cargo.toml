[package]
name = "gtk-liquid-glass"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Liquid glass backdrop for GTK4 layer-shell windows (wlr-screencopy + wgpu + liquid-rust)"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.10.0", features = ["v4_20"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.6.3" }
glib = "0.21.1"
tracing = "0.1.44"
serde_json = "1.0.150"
wayland-client = "0.31.1"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
rustix = { version = "1.1.3", default-features = false, features = ["std", "fs"] }
memmap2 = "0.9.5"
wgpu = "30.0.2"
liquid-rust = "0.2.6"
pollster = "0.4.0"

[[example]]
name = "glass_bench"
path = "examples/glass_bench.rs"
